name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -m "not integration"
      - name: Integration tests (MCP stdio round-trip, Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m pip install "mcp>=1.2"
          python -m pytest -q -m integration

  installer:
    name: installer smoke (venv strategy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: sh -n scripts/install.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -s sh scripts/install.sh
      - name: Fresh install from this checkout
        run: |
          export TESTHOME="$RUNNER_TEMP/fresh-home"
          mkdir -p "$TESTHOME"
          HOME="$TESTHOME" sh scripts/install.sh --strategy venv \
            --git-url "file://$GITHUB_WORKSPACE" --ref "$GITHUB_SHA" \
            --no-service --no-setup
      - name: Verify launcher and doctor
        run: |
          export TESTHOME="$RUNNER_TEMP/fresh-home"
          UA="$TESTHOME/.local/bin/ua"
          "$UA" version
          HOME="$TESTHOME" "$UA" --non-interactive doctor --json > /dev/null
      - name: Uninstall cleanly
        run: |
          export TESTHOME="$RUNNER_TEMP/fresh-home"
          HOME="$TESTHOME" sh scripts/install.sh --uninstall
          test ! -e "$TESTHOME/.local/bin/ua"

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  client-web:
    name: client web and native sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
      - run: npm run native:sync
        working-directory: client

  client-desktop:
    name: desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run desktop:dir
        working-directory: client

  client-android:
    name: Android debug package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci && npm run native:sync
        working-directory: client
      - run: ./gradlew assembleDebug
        working-directory: client/android

  client-ios:
    name: iOS simulator package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci && npm run native:sync
        working-directory: client
      - run: pod install
        working-directory: client/ios/App
      - name: Build without distribution signing
        run: >-
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: client/ios/App
