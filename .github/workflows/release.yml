name: Release

# Fires on version tags (v1.2.3). Builds sdist+wheel, checksums everything a
# user might download (including the installer script), and attaches it all to
# a GitHub Release. PyPI publishing can be added later as a `pypi` job using
# trusted publishing - deliberately not enabled until the name is registered.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          PKG_VERSION="$(python -c 'import pathlib,re; s=pathlib.Path("src/unknown_agent/version.py").read_text(); print(re.search(r"__version__ = \"([^\"]+)\"", s).group(1))')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version.py ($PKG_VERSION)"
            exit 1
          fi

      - name: Test before shipping
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q -m "not integration"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Assemble release assets with checksums
        run: |
          mkdir -p release
          cp dist/* release/
          cp scripts/install.sh release/
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
