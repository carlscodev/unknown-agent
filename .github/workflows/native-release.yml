name: Native client release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Set native client version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: client
      - name: Require desktop signing credentials
        if: runner.os != 'Linux'
        shell: bash
        env:
          CERTIFICATE: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12 || secrets.WINDOWS_CERTIFICATE_P12 }}
          PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: test -n "$CERTIFICATE" -a -n "$PASSWORD"
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      - name: Build signed desktop distributions
        run: npm ci && npm run desktop:dist
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        run: find client/native-dist -maxdepth 3 -name '*.app' -exec codesign --verify --deep --strict --verbose=2 {} \;
      - name: Verify Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem client/native-dist -Filter *.exe | ForEach-Object { signtool verify /pa $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            client/native-dist/*.AppImage
            client/native-dist/*.deb
            client/native-dist/*.dmg
            client/native-dist/*.zip
            client/native-dist/*.exe
          if-no-files-found: error

  android:
    name: Signed Android bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set native client version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: client
      - name: Require Android signing credentials
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: test -n "$KEYSTORE" -a -n "$STORE_PASSWORD" -a -n "$KEY_ALIAS" -a -n "$KEY_PASSWORD"
      - name: Build web assets and sync Android
        run: npm ci && npm run native:sync
        working-directory: client
      - name: Decode signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed Android App Bundle
        working-directory: client/android
        env:
          UA_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          UA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          UA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UA_VERSION_NAME: ${{ github.ref_name }}
          UA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease
      - name: Verify Android signature
        run: jarsigner -verify -strict client/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: client/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: Signed iOS archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Set native client version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: client
      - name: Require Apple signing credentials
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: test -n "$CERT" -a -n "$PROFILE" -a -n "$TEAM" -a -n "$PROFILE_NAME"
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/unknown-agent.mobileprovision"
      - name: Build web assets and sync iOS
        run: npm ci && npm run native:sync
        working-directory: client
      - run: pod install
        working-directory: client/ios/App
      - name: Archive signed iOS application
        working-directory: client/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: >-
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/UnknownAgent.xcarchive"
          DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export signed IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM</string>
            <key>provisioningProfiles</key><dict>
              <key>ai.unknownagent.client</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UnknownAgent.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error

  publish:
    name: Attach native artifacts
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: native-release
          merge-multiple: true
      - name: Generate checksums
        run: find native-release -type f -print0 | sort -z | xargs -0 sha256sum > native-release/SHA256SUMS.native
      - name: Generate SPDX SBOM and signed SLSA provenance
        env:
          UNKNOWN_AGENT_ATTEST_KEY: ${{ secrets.UNKNOWN_AGENT_ATTEST_KEY }}
        run: |
          test -n "$UNKNOWN_AGENT_ATTEST_KEY"
          python -m pip install .
          ua release sbom --output native-release/sbom.spdx.json
          ua release attest --key-ref env:UNKNOWN_AGENT_ATTEST_KEY \
            --revision "$GITHUB_SHA" --builder "https://github.com/flormariap/unknown-agent/actions" \
            --output native-release/provenance.intoto.jsonl
      - uses: softprops/action-gh-release@v2
        with:
          files: native-release/**/*
          generate_release_notes: true
